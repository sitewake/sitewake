# The mirrored practice sites, one port each. Pages were saved by wget with
# --adjust-extension, so a request for /catalogue/page-2 is served from
# page-2.html; the SPA (saucedemo) falls back to its index.

server {
    listen 8101;
    server_name books.bench localhost;
    root /usr/share/nginx/html/books/www;
    index index.html;
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }
}

server {
    listen 8102;
    server_name quotes.bench localhost;
    root /usr/share/nginx/html/quotes/www;
    index index.html;
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }
}

server {
    listen 8103;
    server_name saucedemo.bench localhost;
    root /usr/share/nginx/html/saucedemo/www;
    index index.html;
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
