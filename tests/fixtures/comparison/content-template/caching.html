  <h1>缓存穿透与击穿的区别</h1>
  <p>缓存穿透指查询一个数据库里根本不存在的键，缓存永远不会命中，请求每次都落到数据库上。常见的应对是布隆过滤器或缓存空值。</p>
  <p>缓存击穿指某个热点键恰好过期，大量并发请求同时落到数据库。应对办法是互斥重建或逻辑过期，让只有一个请求去回源，其余等待结果。</p>
  <p>两者的区别在于键是否存在。把它们混为一谈会导致选错方案：给击穿加布隆过滤器毫无用处，给穿透加互斥锁也拦不住不存在的键。</p>
