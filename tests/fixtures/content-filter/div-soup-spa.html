      <div class="sc-m3n4o5">文章详情</div>
      <div class="sc-p6q7r8" data-expect="keep">这套架构把状态管理从组件树里抽了出来，放进一个独立的容器中。组件只负责声明它需要哪些状态切片，容器负责在切片变化时通知对应组件重渲染。这样做的收益是跨层级共享状态不再需要逐层传递属性，代价是调试时需要额外的工具才能看清数据流向。</div>
      <div class="sc-p6q7r8" data-expect="keep">在实践中我们发现，切片划分的粒度比选择哪个状态库更重要。粒度过粗会导致无关组件被频繁唤醒，粒度过细则会让订阅关系本身成为负担。一个经验法则是按照更新频率划分，把每秒都在变的数据与几乎不变的配置分开存放。</div>
    </div>
